name: Tests
on:
  push:
    branches: ["19.0", "19.0-*"]
  pull_request:
    branches: ["19.0"]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/oca/oca-ci/py3.10-odoo19.0:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install module
        run: oca_install_addons
      - name: Run tests
        run: oca_run_tests
